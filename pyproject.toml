[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trustagent"
version = "0.1.0"
description = "Auditable AI support agent + evaluation harness for one Twitter support brand"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "scipy>=1.10",
  "pyarrow>=14.0", "pyyaml>=6.0", "tqdm>=4.66", "python-dotenv>=1.0",
  "matplotlib>=3.7", "anthropic>=0.40", "openai>=1.40",
]

[project.scripts]
trustagent = "trustagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
